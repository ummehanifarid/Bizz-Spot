<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List your business — Mohalla Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="index.html" class="brand">Mohalla<span class="brand-dot">.</span>Guide</a>
    <div class="d-flex align-items-center">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="directory.html">Directory</a>
        <a href="submit.html">List your business</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <span class="icon-moon">🌙</span>
        <span class="icon-sun">☀️</span>
      </button>
    </div>
  </div>
</nav>

<section class="container-narrow" style="padding: 3.5rem 0 5rem;">
  <div class="section-head">
    <h2>List your business</h2>
    <p>Takes under a minute. Your listing goes live as soon as you submit.</p>
  </div>

  <div class="form-card">
    <form id="submitForm" novalidate>
      <div class="form-row">
        <div class="form-field" data-field="business_name">
          <label for="business_name">Business name <span class="required">*</span></label>
          <input type="text" id="business_name" name="business_name">
          <div class="field-error"></div>
        </div>
        <div class="form-field" data-field="owner_name">
          <label for="owner_name">Owner name <span class="required">*</span></label>
          <input type="text" id="owner_name" name="owner_name">
          <div class="field-error"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field" data-field="category">
          <label for="category">Category <span class="required">*</span></label>
          <select id="category" name="category">
            <option value="">Choose a category</option>
            <option>Food</option>
            <option>Fashion</option>
            <option>Tech</option>
            <option>Health</option>
            <option>Education</option>
            <option>Services</option>
            <option>Retail</option>
            <option>Other</option>
          </select>
          <div class="field-error"></div>
        </div>
        <div class="form-field" data-field="city">
          <label for="city">City <span class="required">*</span></label>
          <input type="text" id="city" name="city">
          <div class="field-error"></div>
        </div>
      </div>

      <div class="form-field" data-field="tagline">
        <label for="tagline">Tagline</label>
        <input type="text" id="tagline" name="tagline" placeholder="One line about what you do">
        <div class="field-error"></div>
      </div>

      <div class="form-row">
        <div class="form-field" data-field="website">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" placeholder="https://">
          <div class="field-error"></div>
        </div>
        <div class="form-field" data-field="email">
          <label for="email">Email <span class="required">*</span></label>
          <input type="email" id="email" name="email">
          <div class="field-error"></div>
        </div>
      </div>

      <button type="submit" class="btn-brand" id="submitBtn">Submit business</button>
    </form>

    <div class="success-panel" id="successPanel" style="display:none;">
      <div class="check-mark">✓</div>
      <h3>You're listed!</h3>
      <p style="color:var(--charcoal-soft);">Your business is now live in the directory.</p>
      <div class="d-flex justify-content-center gap-3 mt-3">
        <a href="directory.html" class="btn-outline-brand">View directory</a>
        <button type="button" class="btn-brand" id="addAnotherBtn">Add another</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container-narrow d-flex flex-wrap justify-content-between align-items-end gap-3">
    <div>
      <div class="brand">Mohalla<span class="brand-dot">.</span>Guide</div>
      <p style="margin:0;">A simple directory for local businesses.</p>
    </div>
    <div>
      <a href="index.html">Home</a> &middot; <a href="directory.html">Browse directory</a>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/submit.js"></script>
</body>
</html>
